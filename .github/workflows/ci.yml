name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        env:
          # Playwright browser postinstalls (from @executeautomation/playwright-mcp-server)
          # race on the ms-playwright dirlock under Node 24. CI doesn't run
          # Playwright, so skip the parallel browser downloads entirely.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          install-mode: goinstall
          args: --timeout=5m

      - name: Run Format Check
        run: make -C ${{ github.workspace }} format-check

      - name: Validate Templates
        run: make -C ${{ github.workspace }} validate-templates

      - name: Run Tests (Coverage)
        run: make -C ${{ github.workspace }} cover

      - name: Upload Coverage (Codecov)
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
