name: OS Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  SEPG_SESSION_SECURE: "false"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true

      - name: Run Tests
        shell: bash
        run: go test -tags integration ./...

  test-freebsd:
    name: Test (freebsd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run Tests in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          envs: "SEPG_SESSION_SECURE"
          usesh: true
          prepare: pkg install -y go git
          run: |
            go version
            go test -tags integration ./...
