name: OS Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  SEPG_SESSION_SECURE: "false"

# Compiling github.com/lbe/go-exiftool-wasm/internal/zeroperl peaks near 8 GB.
# -p 2 keeps other heavy compiles from running beside it.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          # setup-go saves its cache only when the job succeeds; Windows saves
          # its own below so failing runs still keep the build cache.
          cache: ${{ runner.os != 'Windows' }}

      - name: Locate Go caches (Windows)
        if: runner.os == 'Windows'
        id: go-paths
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go caches (Windows)
        if: runner.os == 'Windows'
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-paths.outputs.build }}
            ${{ steps.go-paths.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}

      - name: Run Tests
        shell: bash
        run: go test -p 2 -tags integration ./...

      - name: Save Go caches (Windows)
        if: always() && runner.os == 'Windows' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-paths.outputs.build }}
            ${{ steps.go-paths.outputs.mod }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  test-freebsd:
    name: Test (freebsd)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # The Go build and module caches live in .ci-cache in the workspace, which
      # the VM action copies into the VM and back. go test ./... ignores
      # directories that start with a dot.
      - name: Cache Go build and module caches (FreeBSD)
        uses: actions/cache@v6
        with:
          path: .ci-cache
          key: go-freebsd-${{ hashFiles('go.sum') }}

      - name: Run Tests in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          mem: 12288
          usesh: true
          prepare: pkg install -y go git
          # The VM runs as root, which bypasses file permissions; run the tests
          # as an unprivileged user so permission checks are exercised.
          # -modcacherw keeps the module cache writable for the copy back.
          run: |
            pw useradd -n ci -m -s /bin/sh
            mkdir -p .ci-cache
            chown -R ci .
            su -l ci -c "cd '$PWD' && export GOCACHE='$PWD/.ci-cache/gocache' GOMODCACHE='$PWD/.ci-cache/gomodcache' GOFLAGS=-modcacherw && go version && SEPG_SESSION_SECURE=false go test -p 2 -tags integration ./..."
