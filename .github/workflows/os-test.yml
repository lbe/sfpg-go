name: OS Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  SEPG_SESSION_SECURE: "false"

# Compiling github.com/lbe/go-exiftool-wasm/internal/zeroperl peaks near 8 GB.
# -p 2 keeps other heavy compiles from running beside it; runners need >= 14 GB.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel (14 GB) instead of macos-latest (arm64, 7 GB).
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true

      - name: Run Tests
        shell: bash
        run: go test -p 2 -tags integration ./...

  test-freebsd:
    name: Test (freebsd)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run Tests in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          envs: "SEPG_SESSION_SECURE"
          mem: 12288
          usesh: true
          prepare: pkg install -y go git
          run: |
            go version
            go test -p 2 -tags integration ./...
